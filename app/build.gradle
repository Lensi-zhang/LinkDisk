plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def releaseSigningConfigured = [
    'linkdiskStoreFile',
    'linkdiskStorePassword',
    'linkdiskKeyAlias',
    'linkdiskKeyPassword',
].every { !localProperties.getProperty(it, '').isEmpty() }

android {
    namespace 'com.lazybody.linkdisk'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lazybody.linkdisk'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(localProperties.getProperty('linkdiskStoreFile'))
                storePassword localProperties.getProperty('linkdiskStorePassword')
                keyAlias localProperties.getProperty('linkdiskKeyAlias')
                keyPassword localProperties.getProperty('linkdiskKeyPassword')
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    testImplementation 'junit:junit:4.13.2'
}
